<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Kesehatan Mandiri</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Kalkulator Status Kesehatan & BMI</h1>
        <p>Masukkan data tinggi dan berat badan Anda untuk memeriksa status kesehatan tubuh.</p>
        
        <form id="healthForm">
            <div class="input-group">
                <label for="weight">Berat Badan (kg):</label>
                <input type="number" id="weight" required min="1" step="0.1">
            </div>
            
            <div class="input-group">
                <label for="height">Tinggi Badan (cm):</label>
                <input type="number" id="height" required min="1">
            </div>
            
            <button type="button" id="btnCalculate">Cek Status Kesehatan</button>
        </form>

        <div id="resultBox" class="result-box hidden">
            <h2>Hasil Analisis:</h2>
            <p>Skor BMI Anda: <strong id="bmiValue">0</strong></p>
            <p>Kategori: <span id="bmiCategory"></span></p>
            
            <h3>Rekomendasi Kesehatan Untuk Anda:</h3>
            <ul id="recommendationsList"></ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
